<!-- Trang hiển thị phục vụ qua Apps Script (…/exec?token=…&view=1).
     Dùng cho máy Android cũ (Android 5–7) không nhận chứng chỉ của GitHub Pages:
     ảnh được Apps Script tải từ GitHub rồi gửi sang dưới dạng base64.
     Khung "Claude" phía dưới lấy số liệu trực tiếp từ Apps Script (Mac gửi lên 5 phút/lần),
     không phải chờ GitHub vẽ lại ảnh.
     Viết bằng JavaScript đời cũ (ES5) để chạy cả trên Chrome cũ. -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  #imgwrap { position: relative; -webkit-flex: 1; flex: 1; }
  #img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

  #claude { display: none; box-sizing: border-box; padding: 10px 8.5% 14px; border-top: 1px solid #ccc; }
  #claude.on { display: block; }
  .chead { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between;
           -webkit-align-items: baseline; align-items: baseline; font-size: 13px; margin-bottom: 8px; }
  .chead b { font-size: 14px; letter-spacing: .06em; }
  .chead span { color: #777; }
  .chead span.stale { color: #fff; background: #000; padding: 1px 8px; border-radius: 10px; }
  .cols { display: -webkit-flex; display: flex; }
  .col { -webkit-flex: 1; flex: 1; min-width: 0; }
  .col + .col { margin-left: 7%; }
  .row { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between;
         -webkit-align-items: baseline; align-items: baseline; }
  .name { font-size: 14px; color: #333; font-weight: 500; }
  .pct { font-size: 34px; font-weight: 700; line-height: 1.05; }
  .bar { position: relative; height: 12px; border: 2px solid #000; border-radius: 8px; margin: 4px 0 10px; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #000; border-radius: 6px; }
  .mark { position: absolute; top: 14px; width: 0; height: 0; margin-left: -6px;
          border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid #000; }
  .sub { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .warn .pct { text-decoration: underline; }

  body.night { background: #000; color: #8c8c8c; }
  body.night #img { -webkit-filter: invert(1) brightness(.55); filter: invert(1) brightness(.55); }
  body.night #claude { border-top-color: #333; }
  body.night .name, body.night .sub, body.night .chead span { color: #777; }
  body.night .bar { border-color: #8c8c8c; }
  body.night .fill { background: #8c8c8c; }
  body.night .mark { border-bottom-color: #8c8c8c; }
  body.night .chead span.stale { color: #000; background: #8c8c8c; }

  #msg {
    position: fixed; right: 12px; top: 10px; font: 14px/1.3 sans-serif;
    color: #fff; background: rgba(180, 30, 30, .85); padding: 6px 10px; border-radius: 8px; display: none;
  }
</style>
<div id="imgwrap"><img id="img" alt="Dashboard lịch và việc cần làm"></div>
<div id="claude">
  <div class="chead"><b>CLAUDE</b><span id="cupd"></span></div>
  <div class="cols">
    <div class="col" id="c5"></div>
    <div class="col" id="c7"></div>
  </div>
</div>
<div id="msg"></div>
<script>
var params = {};
var img = document.getElementById("img"), msg = document.getElementById("msg");
var lastOk = new Date().getTime(), loadedAt = lastOk;
var usage = null;
var THU = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
var SPAN = { five_hour: 5 * 3600e3, seven_day: 7 * 86400e3 };

function num(v, d) { var n = Number(v); return isNaN(n) || v === undefined || v === "" ? d : n; }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function parseIso(s) { if (!s) return null; var d = new Date(s); return isNaN(d.getTime()) ? null : d; }

function isNight() {
  var dem = params.dem === undefined ? "22-6" : String(params.dem);
  if (dem === "0") return false;
  var p = dem.split("-"), a = Number(p[0]), b = Number(p[1]);
  if (isNaN(a) || isNaN(b)) return false;
  var h = new Date().getHours();
  return a > b ? (h >= a || h < b) : (h >= a && h < b);
}
function applyNight() { document.body.className = isNight() ? "night" : ""; }

function showErr(text) {
  var mins = Math.round((new Date().getTime() - lastOk) / 60000);
  msg.textContent = text + (mins ? " (" + mins + " phút)" : "");
  msg.style.display = "block";
}

// ---------------- khung Claude
function leftText(ms) {
  if (ms <= 0) return "đang đặt lại";
  var m = Math.round(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d) return "còn " + d + " ngày " + h + "g";
  if (h) return "còn " + h + "g " + pad(mm) + "p";
  return "còn " + mm + " phút";
}

function block(key, name) {
  var v = (usage && usage[key]) || {};
  var pct = typeof v.utilization === "number" ? v.utilization : null;
  var now = new Date(), reset = parseIso(v.resets_at);
  var html = '<div class="row' + (pct !== null && pct >= 80 ? ' warn' : '') + '"><span class="name">' + name +
             '</span><span class="pct">' + (pct === null ? "--" : Math.round(pct) + "%") + '</span></div>';
  html += '<div class="bar">';
  if (pct) html += '<div class="fill" style="width:' + Math.max(6, Math.min(pct, 100)) + '%"></div>';
  if (reset && SPAN[key]) {   // ▲ = thời gian đã trôi trong kỳ; phần đen nằm trái ▲ là đang dùng chậm hơn thời gian
    var el = 1 - (reset.getTime() - now.getTime()) / SPAN[key];
    el = Math.min(Math.max(el, 0), 1);
    html += '<div class="mark" style="left:' + (el * 100).toFixed(1) + '%"></div>';
  }
  html += '</div>';
  var sub = "";
  if (reset) {
    var sameDay = reset.toDateString() === now.toDateString();
    sub = "đặt lại " + (sameDay ? "" : THU[reset.getDay()] + " ") + hm(reset) + " · " + leftText(reset.getTime() - now.getTime());
  }
  return html + '<div class="sub">' + (sub || "&nbsp;") + '</div>';
}

function renderClaude() {
  var box = document.getElementById("claude");
  if (!usage) { box.className = ""; return; }
  box.className = "on";
  document.getElementById("c5").innerHTML = block("five_hour", "Phiên 5 giờ");
  document.getElementById("c7").innerHTML = block("seven_day", "Tuần này");
  var upd = document.getElementById("cupd"), f = parseIso(usage.fetched_at);
  if (f) {
    var age = (new Date().getTime() - f.getTime()) / 60000;
    upd.textContent = age > 20 ? "SỐ LIỆU CŨ · " + hm(f) + " " + f.getDate() + "/" + (f.getMonth() + 1) : "cập nhật " + hm(f);
    upd.className = age > 20 ? "stale" : "";
  }
}

function refreshClaude() {
  google.script.run
    .withSuccessHandler(function (s) { try { usage = s ? JSON.parse(s) : null; } catch (e) { usage = null; } renderClaude(); })
    .withFailureHandler(function () {})
    .dashClaude(params.token || "");
}

// ---------------- ảnh dashboard
function refreshImage() {
  google.script.run
    .withSuccessHandler(function (b64) {
      img.src = "data:image/png;base64," + b64;
      lastOk = new Date().getTime();
      msg.style.display = "none";
    })
    .withFailureHandler(function () { showErr("Không tải được ảnh mới · kiểm tra Wi-Fi"); })
    .dashImage(params.token || "");
}

function refresh() { applyNight(); refreshImage(); refreshClaude(); }

// Chạm 2 lần: thử bật toàn màn hình
document.addEventListener("dblclick", function () {
  var de = document.documentElement, req = de.requestFullscreen || de.webkitRequestFullscreen;
  if (req) { try { var p = req.call(de); if (p && p["catch"]) p["catch"](function () {}); } catch (e) {} }
});

google.script.url.getLocation(function (loc) {
  params = loc.parameter || {};
  var everyMin = Math.max(1, num(params.phut, 5));
  refresh();
  setInterval(refresh, everyMin * 60 * 1000);
  setInterval(function () { applyNight(); renderClaude(); }, 60 * 1000);   // đếm ngược "còn …" mỗi phút
  // Tải lại cả trang mỗi ngày lúc ~3h sáng cho trình duyệt cũ khỏi đơ
  setInterval(function () {
    if (new Date().getHours() === 3 && new Date().getTime() - loadedAt > 3600e3) location.reload();
  }, 30 * 60 * 1000);
});
</script>
